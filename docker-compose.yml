# Local stack: api + postgres + redis. Credentials below are for local
# development only. Every published port is bound to 127.0.0.1, so nothing
# is reachable from other machines. For live-reload development, see
# docker-compose.dev.yml (`make docker-up-dev`).

x-redis-password: &redis-password ${REDIS_PASSWORD:-redis_dev_pwd}

services:
  api:
    build: .
    container_name: ai_bi_api
    # Same start command as the image (Dockerfile CMD), with the app factory.
    command: .venv/bin/uvicorn ai_bi_analytics.main:create_app --factory --host 0.0.0.0 --port 8000 --proxy-headers --timeout-graceful-shutdown 20
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    # Inside the compose network the API reaches Postgres and Redis by
    # service name. These override .env, whose DATABASE_URL/REDIS_URL are
    # for running the API on the host.
    environment:
      DATABASE_URL: postgresql+psycopg2://ai_bi_readonly:readonly_pwd@postgres:5432/ai_bi_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pwd}@redis:6379/0
    # Start only once Postgres and Redis accept connections, not merely
    # once their containers exist (audit OPS-3).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: ai_bi_postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pwd
      POSTGRES_DB: ai_bi_db
      # Read-only role the API connects as (created on first start by
      # example/initdb/10_readonly_role.sh). Dev-only credentials.
      APP_DB_READONLY_USER: ai_bi_readonly
      APP_DB_READONLY_PASSWORD: readonly_pwd
    ports:
      - "127.0.0.1:5433:5432" # host 5433 → container 5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./example/initdb/10_readonly_role.sh:/docker-entrypoint-initdb.d/10_readonly_role.sh:ro
      # .sql.in so the entrypoint doesn't auto-run it without psql variables.
      - ./example/readonly_role.sql:/docker-entrypoint-initdb.d/readonly_role.sql.in:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test_user", "-d", "ai_bi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: ai_bi_redis
    # Password-protected even locally (audit OPS-4): an open Redis holds the
    # rate-limit state and cached query results.
    command: ["redis-server", "--requirepass", *redis-password]
    environment:
      REDISCLI_AUTH: *redis-password
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli authenticates via REDISCLI_AUTH (no password on argv).
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
