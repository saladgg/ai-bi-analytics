version: "3.14"

services:
  api:
    build: .
    container_name: ai_bi_api
    command: uv run uvicorn ai_bi_analytics.main:create_app --factory --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:18
    container_name: ai_bi_postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pwd
      POSTGRES_DB: ai_bi_db
      # Read-only role the API connects as (created on first start by
      # example/initdb/10_readonly_role.sh). Dev-only credentials.
      APP_DB_READONLY_USER: ai_bi_readonly
      APP_DB_READONLY_PASSWORD: readonly_pwd
    ports:
      - "5433:5432" # ← Host 5433 → Container 5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./example/initdb/10_readonly_role.sh:/docker-entrypoint-initdb.d/10_readonly_role.sh:ro
      # .sql.in so the entrypoint doesn't auto-run it without psql variables.
      - ./example/readonly_role.sql:/docker-entrypoint-initdb.d/readonly_role.sql.in:ro
    restart: always

  redis:
    image: redis:8
    container_name: ai_bi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:

