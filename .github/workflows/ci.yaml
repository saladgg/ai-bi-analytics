name: CI

on:
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: make install-dev

      - name: Format check
        run: make format

      - name: Lint
        run: make lint

      - name: Test
        env:
          API_KEY: test-api-key
          DATABASE_URL: sqlite:///./test.db
        run: make test

      - name: Wheel smoke test (installs and imports from a clean venv)
        env:
          API_KEY: test-api-key
          DATABASE_URL: sqlite://
        run: |
          uv build --wheel -o dist-smoke
          uv venv /tmp/wheel-smoke
          VIRTUAL_ENV=/tmp/wheel-smoke uv pip install dist-smoke/*.whl
          cd /tmp && /tmp/wheel-smoke/bin/python -I -c "import ai_bi_analytics.main"
