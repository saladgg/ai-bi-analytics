# Development overlay: bind-mount the source and reload on change.
#   make docker-up-dev
#   (= docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build)
services:
  api:
    command: .venv/bin/uvicorn ai_bi_analytics.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    volumes:
      # :z relabels for SELinux hosts (e.g. Fedora); harmless elsewhere.
      - .:/app:z
      # Keep the image's venv: without this, the bind mount above replaces
      # /app/.venv with the host's, whose binaries can't run in the container.
      - /app/.venv
