[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bi-analytics"
version = "1.0.1"
description = "AI-powered Business Intelligence backend built with FastAPI and PostgreSQL."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Salad Guyo", email = "saladguyo60@gmail.com" }
]
classifiers = [
  # How mature is this project
  "Development Status :: 3 - Alpha",
  "Natural Language :: English",
  "Intended Audience :: Developers",
  # Supported python versions
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "fastapi>=0.128.5",
  "uvicorn[standard]>=0.40.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "SQLAlchemy>=2.0.46",
  "psycopg2-binary>=2.9.11",
  "openai>=3.60.0",
  "python-dotenv>=1.2.1",
  "redis>=7.2.0",
  "opentelemetry-instrumentation-fastapi>=0.61b0",
  "opentelemetry-sdk>=1.40.0",
  "opentelemetry-exporter-otlp>=1.40.0",
  "streamlit>=1.55.0",
  "pandas==2.3.3",
  "plotly==6.6.0",
  "sqlglot>=30.35.0",
]

[dependency-groups]
test = [
  "pytest>=9.0.2",
  "pytest-cov>=5.0.0",
  "pytest-sugar~=1.1.1",
  "Faker>=40.4.0",
  "fakeredis[lua]>=2.41.0",
]
dev = [
  { include-group = "test" },
  "ruff>=0.15.1",
  "mypy>=1.19.1",
  "pre-commit>=4.5.0",
  "pip-audit~=2.10",
]

[project.urls]
Homepage = "https://github.com/saladgg/ai-bi-analytics" # todo
Repository = "https://github.com/saladgg/ai-bi-analytics"
Documentation = "https://github.com/saladgg/ai-bi-analytics/docs" # todo
Changelog = "https://github.com/saladgg/ai-bi-analytics/releases"


[tool.setuptools.packages.find]
include = ["ai_bi_analytics*"]

[tool.setuptools.package-data]
ai_bi_analytics = ["core/lua/*.lua"]

[tool.ruff]
include = [
    "ai_bi_analytics/**/*.py",
    "tests/**/*.py",
    "frontend/**/*.py",
    "example/**/*.py",
]
src = ["ai_bi_analytics"]

[tool.ruff.lint]
# S = flake8-bandit security rules (audit CI-1's SAST item).
select = ["E", "F", "I", "B", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use throwaway credentials, and build fixture SQL.
"tests/**/*.py" = ["S101", "S105", "S106", "S608"]
# Bootstrap scripts shell out to psql and generate fake data.
"example/**/*.py" = ["S311", "S603", "S607", "S608"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
plugins = "pydantic.mypy"
python_version = "3.14"
files = ["ai_bi_analytics", "tests", "frontend", "example"]
# The Streamlit app imports its siblings as top-level modules.
mypy_path = ["frontend"]
explicit_package_bases = true
disable_error_code = [
  "var-annotated", "import-untyped",
  "annotation-unchecked", "union-attr", "arg-type"
]


[tool.pytest.ini_options]
# Coverage is a hard gate: line AND branch coverage must stay at 100%.
# Running a subset of tests locally will trip it; pass --no-cov for that.
addopts = """
    --cov=ai_bi_analytics
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
    --durations=10
    --cache-clear
    -v
"""
testpaths = ["tests"]
markers = [
  "integration: needs real backing services (see each module's docstring); skipped when not configured",
]

[tool.coverage.run]
branch = true
source = ["ai_bi_analytics"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"


[tool.semantic_release]
commit_parser = "conventional"
version_toml = [
    "pyproject.toml:project.version:nf"
]
branch = "main"
# uv.lock records the project's own version. Without re-locking, the release
# commit leaves it one version behind and the next `uv run` on any branch
# drags a stray uv.lock bump into an unrelated PR. `uv lock` keeps pinned
# dependency versions unchanged. `uv build` produces the wheel/sdist that
# `publish` attaches to the GitHub release.
build_command = "uv lock && uv build"
assets = ["uv.lock"]

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = false # Override default behavior of suppressing detailed changelog on first version

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "build", "ci", "test", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]   # refactor is often patch, but some teams treat it as minor
